<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460" role="img" aria-labelledby="title desc">
  <title id="title">Income-Lapse-Wahrscheinlichkeit über dem sichtbaren Crediting-Gap</title>
  <desc id="desc">Base-Annahme für drei Garantie-Moneyness-Niveaus. Bis zum Deadband von 0,02 bleibt der Performance-Hazard null. Danach steigt die Gesamtwahrscheinlichkeit und sättigt, wenn der effektive Gap den Clip von 0,30 erreicht. Eine wertvollere Garantie bewirkt stärkere Retention.</desc>
  <style>
    .bg { fill: #ffffff; }
    .grid { stroke: #d9dee7; stroke-width: 1; }
    .axis { stroke: #273142; stroke-width: 1.5; }
    .guide { stroke: #7b8494; stroke-width: 1.25; stroke-dasharray: 5 4; }
    .tick { fill: #273142; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .label { fill: #172033; font: 15px system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 600; }
    .note { fill: #4b5565; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blue { fill: none; stroke: #1769aa; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .orange { fill: none; stroke: #d55e00; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 9 5; }
    .green { fill: none; stroke: #2b8a3e; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 2 4; }
  </style>
  <rect class="bg" width="100%" height="100%"/>

  <text x="85" y="20" class="note">Base · Gesamtwahrscheinlichkeit aus Ordinary plus Performance Cause</text>
  <line x1="85" y1="42" x2="113" y2="42" class="blue"/>
  <text x="120" y="46" class="tick">G/A = 0,5</text>
  <line x1="205" y1="42" x2="233" y2="42" class="orange"/>
  <text x="240" y="46" class="tick">G/A = 1,0</text>
  <line x1="325" y1="42" x2="353" y2="42" class="green"/>
  <text x="360" y="46" class="tick">G/A = 2,0</text>

  <g transform="translate(0 25)">
  <g>
    <line x1="85" y1="350" x2="720" y2="350" class="grid"/>
    <line x1="85" y1="287" x2="720" y2="287" class="grid"/>
    <line x1="85" y1="224" x2="720" y2="224" class="grid"/>
    <line x1="85" y1="161" x2="720" y2="161" class="grid"/>
    <line x1="85" y1="98" x2="720" y2="98" class="grid"/>
