    <line x1="85" y1="350" x2="720" y2="350" class="axis"/>
    <line x1="116.8" y1="35" x2="116.8" y2="350" class="guide"/>
    <line x1="593" y1="35" x2="593" y2="350" class="guide"/>
  </g>

  <g text-anchor="end">
    <text x="75" y="355" class="tick">0 %</text>
    <text x="75" y="292" class="tick">2 %</text>
    <text x="75" y="229" class="tick">4 %</text>
    <text x="75" y="166" class="tick">6 %</text>
    <text x="75" y="103" class="tick">8 %</text>
    <text x="75" y="40" class="tick">10 %</text>
