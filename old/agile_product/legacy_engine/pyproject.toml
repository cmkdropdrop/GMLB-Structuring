[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agile-modelling-engine"
version = "2.2.0"
description = "Research valuation and portfolio projection engine for a generic index-linked lifetime-income case study"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["agile_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
