  <text x="402.5" y="407" text-anchor="middle" class="label">Garantie-Moneyness G / A</text>
  <text x="21" y="192.5" text-anchor="middle" transform="rotate(-90 21 192.5)" class="label">Election-Wahrscheinlichkeit p.a.</text>
  <text x="650" y="53" class="note">Base-Cap 50 %</text>
</svg>
