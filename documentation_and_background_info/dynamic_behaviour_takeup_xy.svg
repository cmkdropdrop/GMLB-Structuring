<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" role="img" aria-labelledby="title desc">
  <title id="title">Income-Election-Wahrscheinlichkeit über der Garantie-Moneyness</title>
  <desc id="desc">Base-Annahme in Policy Year 6. Die Election-Wahrscheinlichkeit steigt mit dem Verhältnis aus Garantiebarwert und Investment Value. Ein sichtbarer Crediting-Gap von 0,10 verschiebt die Kurve nach oben. Beide Kurven erreichen den Base-Cap von 50 Prozent.</desc>
  <style>
    .bg { fill: #ffffff; }
    .grid { stroke: #d9dee7; stroke-width: 1; }
    .axis { stroke: #273142; stroke-width: 1.5; }
    .tick { fill: #273142; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .label { fill: #172033; font: 15px system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 600; }
    .note { fill: #4b5565; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blue { fill: none; stroke: #1769aa; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .orange { fill: none; stroke: #d55e00; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 9 5; }
  </style>
  <rect class="bg" width="100%" height="100%"/>

  <text x="85" y="21" class="note">Base · Policy Year 6 · Bruttoprämie AUD 100.000</text>
  <line x1="430" y1="17" x2="462" y2="17" class="blue"/>
  <text x="470" y="21" class="tick">Gap = 0</text>
  <line x1="560" y1="17" x2="592" y2="17" class="orange"/>
  <text x="600" y="21" class="tick">Gap = 0,10</text>

  <g>
    <line x1="85" y1="350" x2="720" y2="350" class="grid"/>
    <line x1="85" y1="292.7" x2="720" y2="292.7" class="grid"/>
    <line x1="85" y1="235.5" x2="720" y2="235.5" class="grid"/>
    <line x1="85" y1="178.2" x2="720" y2="178.2" class="grid"/>
    <line x1="85" y1="120.9" x2="720" y2="120.9" class="grid"/>
    <line x1="85" y1="63.6" x2="720" y2="63.6" class="grid"/>
    <line x1="85" y1="35" x2="85" y2="350" class="axis"/>
    <line x1="85" y1="350" x2="720" y2="350" class="axis"/>
  </g>

  <g text-anchor="end">
    <text x="75" y="355" class="tick">0 %</text>
    <text x="75" y="297.7" class="tick">10 %</text>
    <text x="75" y="240.5" class="tick">20 %</text>
    <text x="75" y="183.2" class="tick">30 %</text>
    <text x="75" y="125.9" class="tick">40 %</text>
    <text x="75" y="68.6" class="tick">50 %</text>
  </g>
  <g text-anchor="middle">
    <line x1="85" y1="350" x2="85" y2="356" class="axis"/>
    <line x1="296.7" y1="350" x2="296.7" y2="356" class="axis"/>
    <line x1="508.3" y1="350" x2="508.3" y2="356" class="axis"/>
    <line x1="720" y1="350" x2="720" y2="356" class="axis"/>
    <text x="85" y="376" class="tick">0,5</text>
    <text x="296.7" y="376" class="tick">1,0</text>
    <text x="508.3" y="376" class="tick">1,5</text>
    <text x="720" y="376" class="tick">2,0</text>
  </g>

