<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460" role="img" aria-labelledby="title desc">
  <title id="title">Income-Lapse-Wahrscheinlichkeit über der Garantie-Moneyness</title>
  <desc id="desc">Base-Annahme. Ohne Crediting-Gap fällt die jährliche Full-Withdrawal-Wahrscheinlichkeit von rund 1,41 Prozent bei einem Garantieverhältnis von 0,5 auf rund 0,18 Prozent bei einem Verhältnis von 2. Ein Gap von 0,10 erhöht das Niveau, der Retention-Effekt einer wertvollen Garantie bleibt sichtbar.</desc>
  <style>
    .bg { fill: #ffffff; }
    .grid { stroke: #d9dee7; stroke-width: 1; }
    .axis { stroke: #273142; stroke-width: 1.5; }
    .tick { fill: #273142; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .label { fill: #172033; font: 15px system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 600; }
    .note { fill: #4b5565; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blue { fill: none; stroke: #1769aa; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .orange { fill: none; stroke: #d55e00; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 9 5; }
  </style>
  <rect class="bg" width="100%" height="100%"/>

  <text x="85" y="20" class="note">Base · Ordinary plus Performance Cause · Bruttoprämie AUD 100.000</text>
  <line x1="85" y1="42" x2="117" y2="42" class="blue"/>
  <text x="125" y="46" class="tick">Gap = 0</text>
  <line x1="215" y1="42" x2="247" y2="42" class="orange"/>
  <text x="255" y="46" class="tick">Gap = 0,10</text>

  <g transform="translate(0 25)">
  <g>
    <line x1="85" y1="350" x2="720" y2="350" class="grid"/>
    <line x1="85" y1="305" x2="720" y2="305" class="grid"/>
    <line x1="85" y1="260" x2="720" y2="260" class="grid"/>
    <line x1="85" y1="215" x2="720" y2="215" class="grid"/>
    <line x1="85" y1="170" x2="720" y2="170" class="grid"/>
    <line x1="85" y1="125" x2="720" y2="125" class="grid"/>
    <line x1="85" y1="80" x2="720" y2="80" class="grid"/>
    <line x1="85" y1="35" x2="720" y2="35" class="grid"/>
    <line x1="85" y1="35" x2="85" y2="350" class="axis"/>
    <line x1="85" y1="350" x2="720" y2="350" class="axis"/>
  </g>

  <g text-anchor="end">
    <text x="75" y="355" class="tick">0 %</text>
    <text x="75" y="310" class="tick">1 %</text>
    <text x="75" y="265" class="tick">2 %</text>
    <text x="75" y="220" class="tick">3 %</text>
    <text x="75" y="175" class="tick">4 %</text>
    <text x="75" y="130" class="tick">5 %</text>
    <text x="75" y="85" class="tick">6 %</text>
    <text x="75" y="40" class="tick">7 %</text>
  </g>
  <g text-anchor="middle">
    <line x1="85" y1="350" x2="85" y2="356" class="axis"/>
    <line x1="296.7" y1="350" x2="296.7" y2="356" class="axis"/>
    <line x1="508.3" y1="350" x2="508.3" y2="356" class="axis"/>
    <line x1="720" y1="350" x2="720" y2="356" class="axis"/>
    <text x="85" y="376" class="tick">0,5</text>
    <text x="296.7" y="376" class="tick">1,0</text>
    <text x="508.3" y="376" class="tick">1,5</text>
    <text x="720" y="376" class="tick">2,0</text>
  </g>

  <polyline class="blue" points="85.0,286.7 106.2,295.0 127.3,301.7 148.5,307.2 169.7,311.6 190.8,315.4 212.0,318.6 233.2,321.3 254.3,323.7 275.5,325.7 296.7,327.5 317.8,329.1 339.0,330.5 360.2,331.7 381.3,332.9 402.5,333.9 423.7,334.8 444.8,335.6 466.0,336.4 487.2,337.1 508.3,337.7 529.5,338.3 550.7,338.9 571.8,339.4 593.0,339.8 614.2,340.3 635.3,340.7 656.5,341.0 677.7,341.4 698.8,341.7 720.0,342.0"/>
  <polyline class="orange" points="85.0,67.9 106.2,75.8 127.3,82.2 148.5,87.4 169.7,91.6 190.8,95.2 212.0,98.2 233.2,100.8 254.3,103.1 275.5,105.0 296.7,106.7 317.8,123.4 339.0,138.3 360.2,151.7 381.3,163.7 402.5,174.5 423.7,184.4 444.8,193.3 466.0,201.5 487.2,209.0 508.3,215.9 529.5,222.2 550.7,228.1 571.8,233.5 593.0,238.6 614.2,243.2 635.3,247.6 656.5,251.7 677.7,255.5 698.8,259.1 720.0,262.4"/>

  <text x="402.5" y="407" text-anchor="middle" class="label">Garantie-Moneyness G / A</text>
  <text x="21" y="192.5" text-anchor="middle" transform="rotate(-90 21 192.5)" class="label">Full-Withdrawal-Wahrscheinlichkeit p.a.</text>
  </g>
</svg>
