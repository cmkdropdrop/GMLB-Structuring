<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Schematic held-out LSMC validation gate</title>
  <desc id="desc">Two x-y lower-bound plots illustrate a passing and a failing paired non-inferiority test of the frozen LSMC candidate against the best predeclared fixed baseline.</desc>
  <rect width="1100" height="520" fill="#ffffff"/>
  <text x="550" y="35" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Held-out validation determines the deployed policy</text>
  <text x="550" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">Paired policyholder-value difference: frozen candidate minus best predeclared valid baseline</text>

  <rect x="90" y="90" width="430" height="330" rx="6" fill="#f8fafc" stroke="#d1d5db"/>
  <text x="305" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#007a5e">Gate passes</text>
  <line x1="145" y1="375" x2="480" y2="375" stroke="#374151" stroke-width="2"/>
  <line x1="145" y1="145" x2="145" y2="375" stroke="#374151" stroke-width="2"/>
  <line x1="145" y1="320" x2="480" y2="320" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="472" y="312" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6d28d9">non-inferiority threshold −margin</text>
  <line x1="305" y1="225" x2="305" y2="285" stroke="#009e73" stroke-width="5"/>
  <line x1="283" y1="285" x2="327" y2="285" stroke="#009e73" stroke-width="4"/>
  <circle cx="305" cy="225" r="10" fill="#009e73" stroke="#ffffff" stroke-width="2"/>
  <text x="338" y="207" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4b5563">paired mean</text>
  <text x="338" y="283" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4b5563">lower 95% bound</text>
  <text x="305" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">Frozen LSMC candidate</text>
  <text x="305" y="447" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#007a5e">Deploy candidate</text>

  <rect x="580" y="90" width="430" height="330" rx="6" fill="#f8fafc" stroke="#d1d5db"/>
  <text x="795" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#b44e00">Gate fails</text>
  <line x1="635" y1="375" x2="970" y2="375" stroke="#374151" stroke-width="2"/>
  <line x1="635" y1="145" x2="635" y2="375" stroke="#374151" stroke-width="2"/>
  <line x1="635" y1="320" x2="970" y2="320" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="962" y="312" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6d28d9">non-inferiority threshold −margin</text>
  <line x1="795" y1="255" x2="795" y2="350" stroke="#d55e00" stroke-width="5"/>
  <line x1="773" y1="350" x2="817" y2="350" stroke="#d55e00" stroke-width="4"/>
  <circle cx="795" cy="255" r="10" fill="#d55e00" stroke="#ffffff" stroke-width="2"/>
  <text x="828" y="237" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4b5563">paired mean</text>
  <text x="828" y="349" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4b5563">lower 95% bound</text>
  <text x="795" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">Frozen LSMC candidate</text>
  <text x="795" y="447" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#b44e00">Deploy recorded valid fallback</text>

  <text x="48" y="260" text-anchor="middle" transform="rotate(-90 48 260)" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Paired Policyholder PV difference</text>
  <text x="550" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4b5563">Training fits the rule; validation selects the deployable rule; untouched final paths evaluate it.</text>
  <text x="550" y="505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-style="italic" fill="#6b7280">Schematic gate outcomes · not observed results and not to scale</text>
</svg>
