<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">Competing-risk conversion and probability cap</title>
  <desc id="desc">A schematic x-y chart for the case where ordinary probability is below the cap. The implemented Full-Withdrawal probability follows the raw combined-risk curve until it reaches a horizontal plateau; if ordinary probability is already higher, total probability remains at least ordinary.</desc>
  <rect width="760" height="500" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Competing-risk combination and cap</text>
  <text x="380" y="59" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">Illustrated case: ordinary probability is below the configured combined cap</text>

  <rect x="105" y="85" width="600" height="315" rx="5" fill="#f8fafc" stroke="#d1d5db"/>
  <line x1="120" y1="380" x2="690" y2="380" stroke="#374151" stroke-width="2"/>
  <line x1="120" y1="105" x2="120" y2="380" stroke="#374151" stroke-width="2"/>
  <line x1="120" y1="183" x2="690" y2="183" stroke="#cc79a7" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="680" y="173" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#9b4f7c">configured annual probability cap</text>

  <path d="M120 380 C180 287 270 212 390 164 C495 122 595 109 690 106" fill="none" stroke="#6b7280" stroke-width="3.5" stroke-dasharray="10 6"/>
  <path d="M120 380 C180 287 270 212 347 183 H690" fill="none" stroke="#009e73" stroke-width="5" stroke-linejoin="round"/>
  <text x="200" y="122" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#4b5563">raw probability 1 − exp(−h)</text>
  <text x="455" y="210" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#007a5e">implemented capped probability</text>
  <text x="395" y="265" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">h = h ordinary + h performance</text>

  <text x="120" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">0</text>
  <text x="690" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">large h</text>
  <text x="405" y="446" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1f2937">Combined annual integrated hazard h</text>
  <text x="55" y="245" text-anchor="middle" transform="rotate(-90 55 245)" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2937">Annual Full-Withdrawal probability</text>
  <text x="380" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#6b7280">If ordinary probability already exceeds the cap, total remains at least ordinary · not to scale</text>
</svg>
