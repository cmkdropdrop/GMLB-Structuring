<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Schematic survival impact of mortality and longevity stresses</title>
  <desc id="description">Three schematic survival curves share the same starting point. The longevity stress is above the base curve, and the mortality stress is below it. All curves reach zero at the hard terminal age. A note explains that the direction of CSM must be determined by a full shock-and-revalue calculation.</desc>
  <defs>
    <style>
      .heading { font: 700 28px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #14213d; }
      .sub { font: 400 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #536273; }
      .label { font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #14213d; }
      .small { font: 400 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #536273; }
      .boxhead { font: 700 18px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #14213d; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="18" fill="#fffdf7"/>
  <text x="55" y="55" class="heading">Stress direction is clear for survival — not automatically for CSM</text>
  <text x="55" y="83" class="sub">Schematic curves only; not calibrated probabilities and not a completed valuation result</text>

  <line x1="100" y1="505" x2="790" y2="505" stroke="#73808c" stroke-width="2"/>
  <line x1="100" y1="505" x2="100" y2="125" stroke="#73808c" stroke-width="2"/>
  <text x="445" y="548" text-anchor="middle" class="label">Attained age x</text>
  <text x="36" y="315" text-anchor="middle" class="label" transform="rotate(-90 36 315)">Survival probability S(t)</text>
  <text x="78" y="133" class="small">1</text>
  <text x="78" y="510" class="small">0</text>
  <text x="115" y="528" text-anchor="middle" class="small">start age</text>
  <text x="730" y="528" text-anchor="middle" class="small">115</text>

  <line x1="730" y1="108" x2="730" y2="515" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="730" y="103" text-anchor="middle" class="label">terminal age 115</text>

  <path d="M115 125 C330 132 555 230 695 405 C710 425 718 445 720 454 H730 V505" fill="none" stroke="#0f766e" stroke-width="5"/>
  <path d="M115 125 C315 150 545 274 690 438 C705 455 715 470 720 476 H730 V505" fill="none" stroke="#173b63" stroke-width="5" stroke-dasharray="14 7"/>
  <path d="M115 125 C300 172 520 323 680 465 C698 483 712 492 720 494 H730 V505" fill="none" stroke="#c56a1a" stroke-width="5" stroke-dasharray="3 8" stroke-linecap="round"/>

  <rect x="430" y="190" width="245" height="34" rx="8" fill="#e8f6f3"/>
  <line x1="450" y1="207" x2="492" y2="207" stroke="#0f766e" stroke-width="5"/>
  <text x="505" y="213" class="label">Longevity: qₓ lower</text>

  <rect x="430" y="286" width="245" height="34" rx="8" fill="#edf4fb"/>
  <line x1="450" y1="303" x2="492" y2="303" stroke="#173b63" stroke-width="5" stroke-dasharray="12 6"/>
  <text x="505" y="309" class="label">Base</text>

  <rect x="430" y="380" width="245" height="34" rx="8" fill="#fff3dc"/>
  <line x1="450" y1="397" x2="492" y2="397" stroke="#c56a1a" stroke-width="5" stroke-dasharray="3 8" stroke-linecap="round"/>
  <text x="505" y="403" class="label">Mortality: qₓ higher</text>

  <rect x="815" y="126" width="330" height="120" rx="14" fill="#e8f6f3" stroke="#83bcb5"/>
  <text x="840" y="159" class="boxhead">Survival exposure</text>
  <text x="840" y="188" class="small">Lower qₓ generally extends fee, income,</text>
  <text x="840" y="211" class="small">expense and guarantee exposure.</text>
  <text x="840" y="234" class="small">Higher qₓ generally shortens it.</text>

  <rect x="815" y="268" width="330" height="145" rx="14" fill="#fff3dc" stroke="#d4a43b"/>
  <text x="840" y="301" class="boxhead">CSM effect</text>
  <text x="840" y="330" class="small">The sign also depends on account value,</text>
  <text x="840" y="353" class="small">death benefits, fees, claims, expenses,</text>
  <text x="840" y="376" class="small">hedge costs, lapse and spouse state.</text>
  <text x="840" y="400" class="label">Use full shock-and-revalue.</text>

  <rect x="815" y="435" width="330" height="96" rx="14" fill="#edf4fb" stroke="#9fb9d1"/>
  <text x="840" y="468" class="boxhead">Market-cache rule</text>
  <text x="840" y="497" class="small">Non-market mortality stresses do not</text>
  <text x="840" y="510" class="small">change the exact Q-market cache key.</text>

  <text x="600" y="570" text-anchor="middle" class="small">The month ending at age 115 is forced to q = 1.</text>
  <text x="600" y="592" text-anchor="middle" class="small">The terminal sentinel is not interpolated into younger ages.</text>
</svg>
